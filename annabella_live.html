<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Performance Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');
  :root {
    --bg:#f5f7fb; --surface:#fff; --surface2:#f0f3f9; --border:#e4e9f2;
    --text:#1e2640; --text2:#4a5578; --muted:#8a93ad;
    --green:#10b981; --green-bg:#ecfdf5; --yellow:#f59e0b; --yellow-bg:#fffbeb;
    --red:#ef4444; --red-bg:#fef2f2; --blue:#5b6ef5; --blue-bg:#eef0fe;
    --meta:#0866ff; --google:#ea4335; --brand:#7c3aed; --nonbrand:#06b6d4;
    --client:#5b6ef5; --client2:#7c8ef9;
    --radius:16px; --font:'Heebo',system-ui,sans-serif;
  }
  /* ===== CONFIG: changes per client ===== */
  :root {
    --CLIENT_COLOR: #5b6ef5;
    --CLIENT_COLOR2: #7c8ef9;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; line-height:1.5; }
  .hero { background:linear-gradient(135deg,var(--client),var(--client2)); padding:26px 28px 22px; color:#fff; position:relative; overflow:hidden; }
  .hero::after { content:''; position:absolute; right:-70px; top:-70px; width:220px; height:220px; background:rgba(255,255,255,.1); border-radius:50%; }
  .hero-content { max-width:1200px; margin:0 auto; position:relative; z-index:2; }
  .hero-top { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .hero-logo { width:48px; height:48px; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.4); border-radius:13px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
  .brand-logo { height:100px; max-width:380px; object-fit:contain; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
  .footer-agency { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid rgba(0,0,0,.08); }
  .footer-agency span { font-size:12px; color:var(--muted); font-weight:600; }
  .agency-logo { height:34px; object-fit:contain; }
  .hero h1 { font-size:22px; font-weight:800; letter-spacing:-.4px; }
  .hero-sub { font-size:12.5px; opacity:.9; margin-top:2px; }
  .date-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .preset-btn { background:rgba(255,255,255,.15); border:1.5px solid rgba(255,255,255,.3); color:#fff; border-radius:8px; padding:6px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font); transition:all .15s; }
  .preset-btn:hover, .preset-btn.active { background:rgba(255,255,255,.3); border-color:rgba(255,255,255,.6); }
  .date-sep { color:rgba(255,255,255,.6); font-size:12px; }
  .date-input { background:rgba(255,255,255,.92); border:none; color:#1e2640; border-radius:8px; padding:5px 10px; font-size:12px; font-family:var(--font); font-weight:600; outline:none; }
  .apply-btn { background:#fff; color:var(--client); border:none; border-radius:8px; padding:6px 15px; font-size:12px; font-weight:800; cursor:pointer; font-family:var(--font); }
  .live-pill { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:4px 11px; margin-left:auto; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#4ade80; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .live-txt { font-size:11px; font-weight:700; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 28px; }
  .loading { text-align:center; padding:60px 20px; color:var(--muted); }
  .spinner { width:42px; height:42px; border:3px solid var(--border); border-top-color:var(--client); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .sec { font-size:13px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; margin:26px 0 14px; }
  .sec:first-child { margin-top:0; }
  .hl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:-46px; position:relative; z-index:3; }
  .hl-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:0 2px 10px rgba(0,0,0,.06); border-top:3px solid var(--client); }
  .hl-label { font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:8px; }
  .hl-val { font-size:27px; font-weight:800; color:var(--client); letter-spacing:-1px; line-height:1; }
  .hl-sub { font-size:11.5px; color:var(--text2); margin-top:7px; font-weight:600; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .grid-2 { display:grid; grid-template-columns:1.6fr 1fr; gap:16px; }
  @media(max-width:820px){ .grid-2 { grid-template-columns:1fr; } }
  .card-title { font-size:13px; font-weight:700; margin-bottom:3px; }
  .card-sub { font-size:11px; color:var(--muted); margin-bottom:15px; }
  .chart-box { position:relative; height:270px; }
  .chart-box.sm { height:240px; }
  .bn-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:560px; }
  .bn-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.05); border-left:4px solid; }
  .bn-brand { border-left-color:var(--brand); } .bn-nonbrand { border-left-color:var(--nonbrand); }
  .nr-new { border-left-color:var(--client); } .nr-returning { border-left-color:var(--muted); }
  .nr-new .bn-tag, .nr-new .bn-roas { color:var(--client); }
  .nr-returning .bn-tag, .nr-returning .bn-roas { color:var(--text2); }
  .bn-tag { font-size:12px; font-weight:700; margin-bottom:8px; }
  .bn-brand .bn-tag { color:var(--brand); } .bn-nonbrand .bn-tag { color:var(--nonbrand); }
  .bn-roas { font-size:28px; font-weight:800; letter-spacing:-1px; }
  .bn-brand .bn-roas { color:var(--brand); } .bn-nonbrand .bn-roas { color:var(--nonbrand); }
  .bn-detail { font-size:12px; color:var(--muted); margin-top:6px; font-weight:600; }
  .funnel { display:flex; flex-direction:column; gap:12px; }
  .fn-row { display:flex; align-items:center; gap:12px; }
  .fn-label { width:115px; font-size:12px; font-weight:600; flex-shrink:0; }
  .fn-track { flex:1; height:22px; background:var(--surface2); border-radius:6px; overflow:hidden; }
  .fn-fill { height:100%; border-radius:6px; transition:width .3s; }
  .fn-val { width:130px; font-size:11.5px; font-weight:700; text-align:right; flex-shrink:0; }
  .creative-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .cr-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .cr-img { width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--surface2); display:block; }
  .cr-body { padding:10px 12px; }
  .cr-name { font-size:11px; font-weight:600; color:var(--text2); word-break:break-word;
    line-height:1.4; margin-bottom:8px; min-height:30px; }
  .cr-legend { font-size:11px; color:var(--muted); font-weight:600; margin-bottom:12px; }
  .cr-stats { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .cr-stats span:first-child { font-size:13px; font-weight:700; }
  .cr-purch { font-size:11px; color:var(--muted); font-weight:600; }
  .ch-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .ch-row:last-child { margin-bottom:0; }
  .ch-name { width:115px; font-size:12px; font-weight:600; flex-shrink:0; }
  .ch-track { flex:1; height:20px; background:var(--surface2); border-radius:6px; overflow:hidden; }
  .ch-fill { height:100%; border-radius:6px; }
  .ch-val { width:95px; font-size:11.5px; font-weight:700; text-align:right; flex-shrink:0; }
  .tbl-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .tbl-scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:440px; }
  th { background:var(--surface2); padding:12px 15px; font-size:11px; color:var(--text2); font-weight:700; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:11px 15px; border-bottom:1px solid var(--border); font-size:13px; font-weight:500; }
  tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:var(--surface2); }
  .num { font-variant-numeric:tabular-nums; font-weight:600; }
  .chip { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; }
  .c-green { background:var(--green-bg); color:var(--green); } .c-yellow { background:var(--yellow-bg); color:var(--yellow); } .c-red { background:var(--red-bg); color:var(--red); }
  .tag { display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:700; }
  .tag-brand { background:#7c3aed18; color:var(--brand); } .tag-nonbrand { background:#06b6d418; color:var(--nonbrand); }
  .err { background:var(--red-bg); border:1px solid #fecaca; border-radius:12px; padding:24px; text-align:center; color:#991b1b; }
  .err b { display:block; margin-bottom:8px; font-size:16px; }
  .retry { background:var(--client); color:#fff; border:none; border-radius:8px; padding:9px 20px; font-size:13px; font-weight:700; cursor:pointer; margin-top:14px; font-family:var(--font); }
  .footer { text-align:center; padding:26px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--border); margin-top:36px; font-weight:500; }
  @media(max-width:640px){ .wrap,.hero { padding-left:16px; padding-right:16px; } .hl-grid { grid-template-columns:repeat(2,1fr); } }

  .plat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .plat-box { border:1px solid #e6ebf3; border-top:4px solid var(--pc); border-radius:14px; padding:14px 14px 12px; background:#fff; }
  .plat-name { font-weight:800; font-size:14px; color:var(--pc); margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline; }
  .plat-share { font-size:12px; font-weight:700; color:var(--muted); }
  .plat-spend { font-size:22px; font-weight:800; margin-bottom:10px; }
  .plat-row { display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-top:1px dashed #eef2f9; }
  .plat-row span:first-child { color:var(--muted); font-weight:600; }
  .plat-row span:last-child { font-weight:700; }
  .plat-bar { height:6px; border-radius:4px; background:#eef2f9; margin:2px 0 10px; overflow:hidden; }
  .plat-bar > div { height:100%; background:var(--pc); border-radius:4px; }
  @media(max-width:420px){ .plat-grid { grid-template-columns:1fr; } }
</style>
</head>

<script>
// ===== CONFIG — changes per client =====
const CONFIG = {
  client: "annabella",                                    // ← client key
  workerUrl: "https://agency-live-data.erezsteiner.workers.dev",       // ← Worker URL
  color: "#EC0E8D",
  color2: "#f43fa8",
  
  font: "Heebo",
};

// Apply config
document.documentElement.style.setProperty('--client', CONFIG.color);
document.documentElement.style.setProperty('--client2', CONFIG.color2);

let charts = {};
const CH_COLORS = {'חיפוש בתשלום':'#ea4335','Paid Search':'#ea4335','סושיאל בתשלום':'#0866ff','Paid Social':'#0866ff','SMS':'#ec4899','אימייל':'#f59e0b','Email':'#f59e0b','ישיר':'#6b7280','Direct':'#6b7280','חיפוש אורגני':'#10b981','Organic Search':'#10b981','Cross-network':'#a78bfa','שופינג בתשלום':'#34a853','Paid Shopping':'#34a853','Organic Social':'#8b5cf6','Unassigned':'#cbd5e1','Referral':'#06b6d4','Push':'#f472b6'};

const today = new Date(), d30 = new Date(); d30.setDate(today.getDate()-30);
document.getElementById('dTo').value = today.toISOString().split('T')[0];
document.getElementById('dFrom').value = d30.toISOString().split('T')[0];

function setPreset(days, e) {
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const t=new Date(), f=new Date(); f.setDate(t.getDate()-days);
  document.getElementById('dTo').value=t.toISOString().split('T')[0];
  document.getElementById('dFrom').value=f.toISOString().split('T')[0];
  loadData();
}
function applyCustom() {
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  loadData();
}

// Meta ad account bills in USD; Google Ads already bills in ILS.
// Fetch a live daily USD→ILS rate and convert Meta figures before rendering.
let usdToIls = 3.7; // fallback only, used if the live-rate fetch fails
async function getUsdToIlsRate() {
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/USD');
    const j = await r.json();
    if (j && j.rates && j.rates.ILS) return j.rates.ILS;
  } catch (e) { /* fall back below */ }
  try {
    const r2 = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    const j2 = await r2.json();
    if (j2 && j2.rates && j2.rates.ILS) return j2.rates.ILS;
  } catch (e) { /* use hardcoded fallback */ }
  return usdToIls;
}

// Converts every Meta ($) figure in the payload to ILS in place, and rescales
// any ROAS that was computed server-side against the unconverted USD spend.
function convertMetaSpendToIls(d, rate) {
  if (d.meta && typeof d.meta.spend === 'number') d.meta.spend = d.meta.spend * rate;
  if (d.meta && typeof d.meta.value === 'number') d.meta.value = d.meta.value * rate;
  // Meta returns both spend and purchase value in the ad account currency (USD),
  // so ROAS (value ÷ spend) is already currency-neutral — convert amounts only, never the ratio.
  (d.meta_campaigns || []).forEach(c => {
    if (typeof c.spend === 'number') c.spend = c.spend * rate;
    if (typeof c.value === 'number') c.value = c.value * rate;
  });
  (d.top_creatives || []).forEach(c => {
    if (typeof c.spend === 'number') c.spend = c.spend * rate;
    if (typeof c.value === 'number') c.value = c.value * rate;
  });
  return d;
}

async function loadData() {
  const from = document.getElementById('dFrom').value;
  const to = document.getElementById('dTo').value;
  if (!from || !to) { alert('Please select dates'); return; }

  document.getElementById('root').innerHTML = `<div class="loading"><div class="spinner"></div><div style="font-weight:600">Loading live data...</div><div style="font-size:12px;margin-top:6px;opacity:.7">${from} to ${to}</div></div>`;
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); charts={};

  try {
    const [res, rate] = await Promise.all([
      fetch(`${CONFIG.workerUrl}/?client=${CONFIG.client}&from=${from}&to=${to}`),
      getUsdToIlsRate()
    ]);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    convertMetaSpendToIls(d, rate);
    d._usdIls = rate;
    // Blended ROAS depends on total spend, so recompute it now that Meta spend is in ILS
    const totalSpendIls = (d.meta?.spend||0) + (d.google?.spend||0);
    d.blended_roas = totalSpendIls > 0 ? ((d.ga4?.revenue||0) / totalSpendIls).toFixed(2) : 0;
    render(d);
  } catch (e) {
    document.getElementById('root').innerHTML = `<div class="err"><b>⚠️ Error loading data</b>${e.message}<br><button class="retry" onclick="loadData()">🔄 Try again</button></div>`;
  }
}

const fmt = n => '₪' + Math.round(n||0).toLocaleString('en-US');
const rClass = r => r>=4?'c-green':r>=2?'c-yellow':'c-red';

function render(d) {
  const totalSpend = (d.meta?.spend||0) + (d.google?.spend||0);
  // Shopify = מקור אמת; אם אין בו הזמנות לתקופה (למשל מעבר ל-60 יום בלי read_all_orders) אבל ב-GA4 יש — חוזרים ל-GA4
  const sh = (d.shopify && !(d.shopify.orders === 0 && (d.ga4?.transactions||0) > 0)) ? d.shopify : null;
  const G = x => (x && x.gross != null) ? x.gross : (x ? x.revenue : 0);   // ברוטו לפני החזרות, עם חזרה לנטו
  const revenue = sh ? (sh.gross_revenue != null ? sh.gross_revenue : sh.revenue) : (d.ga4?.revenue||0);
  const netRev = sh ? sh.revenue : revenue;
  const returnsAmt = sh ? Math.max(0, revenue - netRev) : 0;
  const orders = sh ? sh.orders : (d.ga4?.transactions||0);
  const cr = d.ga4?.sessions > 0 ? (orders/d.ga4.sessions*100).toFixed(2) : 0;
  const aov = orders > 0 ? (revenue / orders) : 0;
  const blended = sh ? (totalSpend > 0 ? (revenue/totalSpend).toFixed(2) : 0) : (d.blended_roas||0);
  const blendedNet = sh && totalSpend > 0 ? (netRev/totalSpend).toFixed(2) : null;

  // Highlights
  let hl = `<div class="hl-card"><div class="hl-label">${sh?'Gross Revenue (Shopify)':'GA4 Revenue (Website)'}</div><div class="hl-val">${fmt(revenue)}</div><div class="hl-sub">${orders.toLocaleString()} orders${sh?' · before returns':''}</div></div>
    ${sh?`<div class="hl-card"><div class="hl-label">Net Revenue (after returns)</div><div class="hl-val">${fmt(netRev)}</div><div class="hl-sub">Returns ${fmt(returnsAmt)} (${revenue>0?(returnsAmt/revenue*100).toFixed(1):0}%)</div></div>`:''}
    <div class="hl-card"><div class="hl-label">Orders</div><div class="hl-val">${orders.toLocaleString()}</div><div class="hl-sub">${sh?(sh.units||0).toLocaleString()+' units sold':'GA4 transactions'}</div></div>
    <div class="hl-card"><div class="hl-label">Total Ad Spend</div><div class="hl-val">${fmt(totalSpend)}</div><div class="hl-sub">Meta + Google${d._usdIls && (d.meta?.spend||0)>0 ? ' · Meta USD→₪ at ' + (+d._usdIls).toFixed(3) : ''}</div></div>
    <div class="hl-card"><div class="hl-label">Blended ROAS</div><div class="hl-val">${blended}x</div><div class="hl-sub">${blendedNet!=null?'Gross · net '+blendedNet+'x':'Revenue ÷ Spend'}</div></div>
    ${d.meta?.spend>0?`<div class="hl-card"><div class="hl-label">ROAS Meta</div><div class="hl-val">${(+d.meta.roas||0).toFixed(2)}x</div><div class="hl-sub">As reported by Meta</div></div>`:''}
    ${d.google?.spend>0?`<div class="hl-card"><div class="hl-label">ROAS Google</div><div class="hl-val">${(+d.google.roas||0).toFixed(2)}x</div><div class="hl-sub">As reported by Google</div></div>`:''}
    <div class="hl-card"><div class="hl-label">Sessions</div><div class="hl-val">${((d.ga4?.sessions||0)/1000).toFixed(1)}K</div><div class="hl-sub">${cr}% conversion</div></div>
    <div class="hl-card"><div class="hl-label">Average Order Value (AOV)</div><div class="hl-val">${fmt(aov)}</div><div class="hl-sub">Revenue ÷ Orders</div></div>`;

  // Brand/Non-Brand
  let bn = '';
  if (d.google?.spend > 0 && d.google.brand) {
    const gb = d.google.brand, gn = d.google.nonbrand;
    bn = `<div class="sec">🏷️ Google Ads — Brand vs Non-Brand</div><div class="bn-grid">
      <div class="bn-card bn-brand"><div class="bn-tag">🟣 Brand</div><div class="bn-roas">${gb.spend>0?gb.roas+'x':'—'}</div><div class="bn-detail">${gb.spend>0?fmt(gb.spend)+' → '+fmt(gb.value):'No Brand campaign'}</div></div>
      <div class="bn-card bn-nonbrand"><div class="bn-tag">🔵 Non-Brand</div><div class="bn-roas">${gn.roas}x</div><div class="bn-detail">${fmt(gn.spend)} → ${fmt(gn.value)}</div></div>
    </div>`;
  }

  // Conversion funnel (GA4)
  let funnelHtml = '';
  const sess = d.ga4?.sessions || 0;
  if (sess > 0) {
    const atc = d.ga4?.atc || 0;
    const checkouts = d.ga4?.checkouts || 0;
    const trans = d.ga4?.transactions || 0;
    const atcPct = (atc / sess * 100);
    const checkoutPct = (checkouts / sess * 100);
    const crPct = +(trans / sess * 100).toFixed(2); // משפך GA4 — רכישות ושיעור מאותו מקור
    const atcW = Math.min(Math.max(atcPct, 3), 100);
    const checkoutW = Math.min(Math.max(checkoutPct, 3), 100);
    const crW = Math.min(Math.max(crPct, 3), 100);
    const checkoutRow = checkouts > 0
      ? `<div class="fn-row"><div class="fn-label">Checkout</div><div class="fn-track"><div class="fn-fill" style="width:${checkoutW}%;background:#f59e0b"></div></div><div class="fn-val">${checkouts.toLocaleString()} · ${checkoutPct.toFixed(1)}%</div></div>`
      : '';
    funnelHtml = `<div class="sec">🔻 Conversion Funnel (GA4)</div><div class="card"><div class="funnel">
      <div class="fn-row"><div class="fn-label">Sessions</div><div class="fn-track"><div class="fn-fill" style="width:100%;background:var(--client)"></div></div><div class="fn-val">${sess.toLocaleString()}</div></div>
      <div class="fn-row"><div class="fn-label">Add to Cart</div><div class="fn-track"><div class="fn-fill" style="width:${atcW}%;background:var(--client2)"></div></div><div class="fn-val">${atc.toLocaleString()} · ${atcPct.toFixed(1)}%</div></div>
      ${checkoutRow}
      <div class="fn-row"><div class="fn-label">Purchases</div><div class="fn-track"><div class="fn-fill" style="width:${crW}%;background:#10b981"></div></div><div class="fn-val">${trans.toLocaleString()} · ${crPct}%</div></div>
    </div></div>`;
  }

  // New vs returning customers
  let newReturningHtml = '';
  const snr = sh && sh.new_vs_returning;
  const nr = d.new_vs_returning;
  if (snr && (snr.new.orders + snr.returning.orders) > 0) {
    const tot = snr.new.orders + snr.returning.orders;
    const nAvg = snr.new.orders > 0 ? G(snr.new) / snr.new.orders : 0;
    const rAvg = snr.returning.orders > 0 ? G(snr.returning) / snr.returning.orders : 0;
    newReturningHtml = `<div class="sec">👥 New vs Returning Customers · Shopify</div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px">Total ${tot.toLocaleString()} orders in period · share of orders</div>
    <div class="bn-grid">
      <div class="bn-card nr-new"><div class="bn-tag">🆕 New (${(snr.new.orders/tot*100).toFixed(0)}%)</div><div class="bn-roas">${fmt(G(snr.new))}</div><div class="bn-detail">Net ${fmt(snr.new.revenue)} · ${snr.new.orders.toLocaleString()} orders · ${fmt(nAvg)} avg order value</div></div>
      <div class="bn-card nr-returning"><div class="bn-tag">🔁 Returning (${(snr.returning.orders/tot*100).toFixed(0)}%)</div><div class="bn-roas">${fmt(G(snr.returning))}</div><div class="bn-detail">Net ${fmt(snr.returning.revenue)} · ${snr.returning.orders.toLocaleString()} orders · ${fmt(rAvg)} avg order value</div></div>
    </div>`;
  } else if (nr && (nr.new.sessions + nr.returning.sessions) > 0) {
    const nRoas = nr.new.transactions > 0 ? (nr.new.revenue / nr.new.transactions) : 0;
    const rRoas = nr.returning.transactions > 0 ? (nr.returning.revenue / nr.returning.transactions) : 0;
    const totalSess = nr.new.sessions + nr.returning.sessions;
    const newPct = (nr.new.sessions / totalSess * 100).toFixed(0);
    const retPct = (nr.returning.sessions / totalSess * 100).toFixed(0);
    newReturningHtml = `<div class="sec">👥 New vs Returning Customers</div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px">Total ${(nr.new.transactions+nr.returning.transactions).toLocaleString()} orders in period</div>
    <div class="bn-grid">
      <div class="bn-card nr-new"><div class="bn-tag">🆕 New (${newPct}%)</div><div class="bn-roas">${fmt(nr.new.revenue)}</div><div class="bn-detail">${nr.new.transactions.toLocaleString()} orders · ${fmt(nRoas)} avg order value</div></div>
      <div class="bn-card nr-returning"><div class="bn-tag">🔁 Returning (${retPct}%)</div><div class="bn-roas">${fmt(nr.returning.revenue)}</div><div class="bn-detail">${nr.returning.transactions.toLocaleString()} orders · ${fmt(rRoas)} avg order value</div></div>
    </div>`;
  }

  // Channels
  const ch = d.channels || {};
  const chS = Object.entries(ch).sort((a,b)=>b[1]-a[1]).filter(([k,v])=>v>0);
  const chMax = chS.length ? chS[0][1] : 1;
  const chBars = chS.map(([n,r])=>`<div class="ch-row"><div class="ch-name">${n}</div><div class="ch-track"><div class="ch-fill" style="width:${r/chMax*100}%;background:${CH_COLORS[n]||'#94a3b8'}"></div></div><div class="ch-val">${fmt(r)}</div></div>`).join('');

  // Tables
  const mc = (d.meta_campaigns||[]).map(c=>`<tr><td>${c.name}</td><td class="num">${fmt(c.spend)}</td><td><span class="chip ${rClass(c.roas)}">${(c.roas||0).toFixed(2)}x</span></td><td class="num">${Math.round(c.purch||0)}</td></tr>`).join('');
  const gc = d.google_campaigns || [];
  let gcSection = '';
  if (gc.length) {
    gcSection = `<div class="sec">📋 Google Ads Campaigns</div><div class="tbl-card"><div class="tbl-scroll"><table><thead><tr><th>Campaign</th><th>Type</th><th>Spend</th><th>ROAS</th></tr></thead><tbody>${gc.map(c=>`<tr><td>${c.name}</td><td><span class="tag tag-${c.type}">${c.type==='brand'?'Brand':'Non-Brand'}</span></td><td class="num">${fmt(c.spend)}</td><td><span class="chip ${rClass(c.roas)}">${(c.roas||0).toFixed(1)}x</span></td></tr>`).join('')}</tbody></table></div></div>`;
  }

  // Best Sellers (top products)
  const products = (sh && sh.top_products?.length) ? sh.top_products : (d.top_products || []);
  let productsSection = '';
  if (products.length) {
    productsSection = `<div class="sec">🛍️ Top Products (Best Sellers)${sh?' · Shopify':''}</div><div class="tbl-card"><div class="tbl-scroll"><table><thead><tr><th>#</th><th>Product</th><th>Revenue</th><th>Units</th></tr></thead><tbody>${products.map((p,i)=>`<tr><td class="num" style="color:var(--muted)">${i+1}</td><td>${p.name}</td><td class="num">${fmt(p.revenue)}</td><td class="num">${p.qty}</td></tr>`).join('')}</tbody></table></div></div>`;
  }

  // Top campaigns by GA4
  const gaCampaigns = d.top_campaigns || [];
  let gaCampaignsSection = '';
  if (gaCampaigns.length) {
    gaCampaignsSection = `<div class="sec">🎯 Top Campaigns (GA4)</div><div class="tbl-card"><div class="tbl-scroll"><table><thead><tr><th>#</th><th>Campaign</th><th>Revenue</th><th>Orders</th><th>Sessions</th></tr></thead><tbody>${gaCampaigns.map((c,i)=>`<tr><td class="num" style="color:var(--muted)">${i+1}</td><td>${c.name}</td><td class="num">${fmt(c.revenue)}</td><td class="num">${c.transactions}</td><td class="num">${c.sessions.toLocaleString()}</td></tr>`).join('')}</tbody></table></div></div>`;
  }

  // Creative performance (Meta)
  const creatives = d.top_creatives || [];
  let creativesSection = '';
  if (creatives.length) {
    const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    creativesSection = `<div class="sec">🖼️ Creative Performance (Meta)</div>
      <div class="cr-legend">🟢 ROAS 4x and above &nbsp; 🟡 ROAS 2–4x &nbsp; 🔴 ROAS below 2x</div>
      <div class="creative-grid">${creatives.map(c=>`
      <div class="cr-card">
        <img class="cr-img" src="${esc(c.thumbnail)}" alt="" loading="lazy" onerror="this.onerror=null;this.style.display='none'">
        <div class="cr-body">
          <div class="cr-name">${esc(c.name)}</div>
          <div class="cr-stats">
            <span>${fmt(c.spend)}</span>
            <span class="chip ${rClass(c.roas)}">${c.roas.toFixed(2)}x</span>
          </div>
          <div class="cr-purch">${c.purch} purchases</div>
        </div>
      </div>`).join('')}</div>`;
  }

  // Shopify — order source & discount codes
  const SRC_EN = {'Meta':'Meta (FB/IG)','Google':'Google','TikTok':'TikTok','Email/SMS':'Email / SMS','Direct':'Direct','Unknown':'Unattributed','Other':'Other'};
  const SRC_COLOR = {'Meta':'#0866ff','Google':'#ea4335','TikTok':'#111827','Email/SMS':'#f59e0b','Direct':'#64748b','Unknown':'#cbd5e1','Other':'#94a3b8'};
  let shopSourcesSection = '';
  const srcs = (sh && sh.order_sources) || [];
  if (srcs.length) {
    const sMax = Math.max(...srcs.map(x=>G(x)), 1);
    const sTot = srcs.reduce((a,x)=>a+x.orders,0);
    shopSourcesSection = `<div class="sec">🧭 Order Source · Shopify</div><div class="card">
      <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px">Based on the customer's last visit before purchase (store data, not platform reporting)</div>
      ${srcs.map(x=>`<div class="ch-row"><div class="ch-name">${SRC_EN[x.channel]||x.channel}</div><div class="ch-track"><div class="ch-fill" style="width:${G(x)/sMax*100}%;background:${SRC_COLOR[x.channel]||'#94a3b8'}"></div></div><div class="ch-val" style="width:auto;min-width:150px">${fmt(G(x))} gross · ${x.orders} orders (${(x.orders/sTot*100).toFixed(0)}%)</div></div>`).join('')}
    </div>`;
  }
  let discountSection = '';
  const dc = sh && sh.discount_codes;
  if (dc && dc.codes && dc.codes.length) {
    const escD = x => String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const m2 = n => { const v = +n || 0; return (v < 0 ? '-₪' : '₪') + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
    const exact = dc.basis === 'shopify_analytics_discounts';
    const head = exact
      ? '<th>Discount name</th><th>Discounted orders</th><th>Gross sales</th><th>Sales reversals</th><th>Net sales</th><th>Total sales</th>'
      : '<th>Code</th><th>Orders</th><th>Gross</th><th>Net</th>';
    const rowHtml = c => exact
      ? `<td>${escD(c.code)}</td><td class="num">${(c.orders||0).toLocaleString()}</td><td class="num">${m2(c.gross)}</td><td class="num">${m2(c.reversals)}</td><td class="num">${m2(c.net)}</td><td class="num">${m2(c.total)}</td>`
      : `<td>${escD(c.code)}</td><td class="num">${c.orders}</td><td class="num">${fmt(G(c))}</td><td class="num">${fmt(c.revenue)}</td>`;
    const sumRow = exact && dc.summary
      ? `<tr style="background:var(--surface2);font-weight:800"><td><b>Summary</b></td><td class="num">${dc.summary.orders.toLocaleString()}</td><td class="num">${m2(dc.summary.gross)}</td><td class="num">${m2(dc.summary.reversals)}</td><td class="num">${m2(dc.summary.net)}</td><td class="num">${m2(dc.summary.total)}</td></tr>`
      : '';
    discountSection = `<div class="sec">🏷️ Discount Codes · Shopify</div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px">${dc.orders_with_code.toLocaleString()} of ${(dc.total_orders||0).toLocaleString()} orders used a code (${dc.total_orders>0?(dc.orders_with_code/dc.total_orders*100).toFixed(0):0}%)${exact?' · Same calculation as Shopify Analytics › Discounts (sales excl. VAT; Total sales incl. VAT)':''}</div>
    <div class="tbl-card"><div class="tbl-scroll"><table><thead><tr>${head}</tr></thead><tbody>${sumRow}${dc.codes.map(c=>`<tr>${rowHtml(c)}</tr>`).join('')}</tbody></table></div></div>`;
  }

  // Email & SMS marketing (Klaviyo)
  let klaviyoSection = '';
  const kv = d.klaviyo;
  if (kv) {
    const escK = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const share = revenue > 0 ? (kv.revenue / revenue * 100) : 0;
    const flowPct = kv.revenue > 0 ? (kv.flow_revenue / kv.revenue * 100) : 0;
    const chTag = c => c === 'sms' ? 'SMS' : c === 'multi' ? 'Email + SMS' : 'Email';
    const net = (kv.list.subscribed != null && kv.list.unsubscribed != null) ? kv.list.subscribed - kv.list.unsubscribed : null;
    const flowRows = (kv.flows||[]).map(f=>`<tr><td>${escK(f.name)}</td><td>${chTag(f.channel)}</td><td class="num">${f.recipients.toLocaleString()}</td><td class="num">${f.click_rate}%</td><td class="num">${Math.round(f.orders)}</td><td class="num">${fmt(f.revenue)}</td><td class="num">₪${f.rev_per_recipient.toFixed(2)}</td></tr>`).join('');
    const campRows = (kv.campaigns||[]).map(c=>`<tr><td>${escK(c.name)}</td><td>${c.send_time?String(c.send_time).slice(0,10):'—'}</td><td>${chTag(c.channel)}</td><td class="num">${c.recipients.toLocaleString()}</td><td class="num">${c.click_rate}%</td><td class="num">${Math.round(c.orders)}</td><td class="num">${fmt(c.revenue)}</td></tr>`).join('');
    klaviyoSection = `<div class="sec">✉️ Email & SMS Marketing · Klaviyo</div>
    <div class="hl-grid" style="margin-top:0">
      <div class="hl-card"><div class="hl-label">Email & SMS Revenue</div><div class="hl-val">${fmt(kv.revenue)}</div><div class="hl-sub">${Math.round(kv.orders).toLocaleString()} attributed orders</div></div>
      ${sh?`<div class="hl-card"><div class="hl-label">Share of Store Revenue</div><div class="hl-val">${share.toFixed(1)}%</div><div class="hl-sub">of Shopify gross revenue</div></div>`:''}
      <div class="hl-card"><div class="hl-label">Automations (Flows)</div><div class="hl-val">${fmt(kv.flow_revenue)}</div><div class="hl-sub">${flowPct.toFixed(0)}% of email revenue</div></div>
      <div class="hl-card"><div class="hl-label">Campaigns</div><div class="hl-val">${fmt(kv.campaign_revenue)}</div><div class="hl-sub">${kv.campaigns_sent} sent · ${kv.recipients.toLocaleString()} recipients</div></div>
      ${kv.list.subscribed!=null?`<div class="hl-card"><div class="hl-label">New Email Subscribers</div><div class="hl-val">${kv.list.subscribed.toLocaleString()}</div><div class="hl-sub">${kv.list.unsubscribed!=null?kv.list.unsubscribed.toLocaleString()+' unsubscribed · net '+(net>=0?'+':'')+net.toLocaleString():''}</div></div>`:''}
      ${kv.back_in_stock!=null?`<div class="hl-card"><div class="hl-label">Back-in-Stock Requests</div><div class="hl-val">${kv.back_in_stock.toLocaleString()}</div><div class="hl-sub">Customers waiting for restock</div></div>`:''}
    </div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin:10px 0">Revenue attributed by Klaviyo to emails and SMS (orders placed after opening or clicking). Updates every few hours.</div>
    ${flowRows?`<div class="tbl-card" style="margin-bottom:14px"><div class="tbl-scroll"><table><thead><tr><th>Flow</th><th>Channel</th><th>Recipients</th><th>Click rate</th><th>Orders</th><th>Revenue</th><th>Rev / recipient</th></tr></thead><tbody>${flowRows}</tbody></table></div></div>`:''}
    ${campRows?`<div class="tbl-card"><div class="tbl-scroll"><table><thead><tr><th>Campaign</th><th>Sent</th><th>Channel</th><th>Recipients</th><th>Click rate</th><th>Orders</th><th>Revenue</th></tr></thead><tbody>${campRows}</tbody></table></div></div>`:''}`;
  }

  // הוצאה לפי פלטפורמה — ריבועים
  const platTotal = (d.meta?.spend||0) + (d.google?.spend||0);
  const platDefs = [
    {key:'meta', name:'Meta', color:'#0866ff', purch: d.meta?.purch},
    {key:'google', name:'Google', color:'#ea4335', purch: null},
  ];
  const platBoxes = platTotal > 0 ? `<div class="plat-grid">${platDefs.filter(p => (d[p.key]?.spend||0) > 0).map(p => {
    const sp = d[p.key].spend, roas = +d[p.key].roas || 0, share = sp / platTotal * 100;
    return `<div class="plat-box" style="--pc:${p.color}"><div class="plat-name">${p.name}<span class="plat-share">${share.toFixed(0)}% of spend</span></div>
      <div class="plat-spend">${fmt(sp)}</div><div class="plat-bar"><div style="width:${share}%"></div></div>
      <div class="plat-row"><span>ROAS</span><span>${roas.toFixed(2)}x</span></div>
      <div class="plat-row"><span>Revenue (platform-reported)</span><span>${fmt(d[p.key].value!=null ? d[p.key].value : sp*roas)}</span></div>
      ${p.purch!=null?`<div class="plat-row"><span>Purchases</span><span>${Math.round(p.purch).toLocaleString()}</span></div>`:''}</div>`;
  }).join('')}</div>` : `<div style="color:var(--muted);text-align:center;padding:20px">No spend in period</div>`;

  document.getElementById('root').innerHTML = `
    <div class="hl-grid">${hl}</div>
    ${d.meta_data_issue ? `<div class="err" style="margin:14px 0 0;padding:12px 16px;text-align:left;font-size:13px">⚠️ Meta data for this period is still updating — Meta spend and ROAS will refresh shortly.</div>` : ''}
    <div class="sec">📈 Daily Performance Trend</div>
    <div class="grid-2">
      <div class="card"><div class="card-title">Revenue vs Sessions — Daily</div><div class="card-sub">${d.period.from} to ${d.period.to}</div><div class="chart-box"><canvas id="trendC"></canvas></div></div>
      <div class="card"><div class="card-title">Spend by Platform</div><div class="card-sub">Meta vs Google</div>${platBoxes}</div>
    </div>
    ${bn}
    ${funnelHtml}
    ${newReturningHtml}
    <div class="sec">💰 Revenue by Channel (GA4)</div><div class="card">${chBars||'<div style="color:var(--muted);text-align:center;padding:20px">No channel data for this period</div>'}</div>
    ${productsSection}
    ${shopSourcesSection}
    ${discountSection}
    ${klaviyoSection}
    ${gaCampaignsSection}
    ${creativesSection}
    <div class="sec">📋 Meta Campaigns</div><div class="tbl-card"><div class="tbl-scroll"><table><thead><tr><th>Campaign</th><th>Spend</th><th>ROAS</th><th>Purchases</th></tr></thead><tbody>${mc}</tbody></table></div></div>
    ${gcSection}`;

  // Trend chart
  const ga4d = d.daily || {dates:[],revenue:[],sessions:[]};
  const revd = (sh && sh.daily?.dates?.length) ? sh.daily : ga4d;
  const revBy = {}, sesBy = {};
  const netBy = {};
  (revd.dates||[]).forEach((x,i) => { revBy[x] = ((revd.gross||revd.revenue)||[])[i] || 0; netBy[x] = (revd.revenue||[])[i] || 0; });
  (ga4d.dates||[]).forEach((x,i) => sesBy[x] = (ga4d.sessions||[])[i] || 0);
  const trendDates = [...new Set([...(revd.dates||[]), ...(ga4d.dates||[])])].sort();
  charts.trend = new Chart(document.getElementById('trendC'), {
    type:'line',
    data:{labels:trendDates,datasets:[
      {label:sh?'Gross Revenue (Shopify)':'Revenue (GA4)',data:trendDates.map(x=>revBy[x]||0),yAxisID:'y',borderColor:CONFIG.color,backgroundColor:CONFIG.color+'1a',borderWidth:2.5,tension:.35,pointRadius:0,fill:true},
      ...(sh && revd.gross ? [{label:'Net revenue',data:trendDates.map(x=>netBy[x]||0),yAxisID:'y',borderColor:CONFIG.color,backgroundColor:'transparent',borderWidth:1.5,borderDash:[2,3],tension:.35,pointRadius:0,fill:false}] : []),
      {label:'Sessions',data:trendDates.map(x=>sesBy[x]||0),yAxisID:'y1',borderColor:'#94a3b8',backgroundColor:'transparent',borderWidth:2,borderDash:[5,4],tension:.35,pointRadius:0,fill:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:true,position:'bottom',labels:{font:{family:CONFIG.font,size:11},usePointStyle:true,boxHeight:6,padding:12}},
        tooltip:{bodyFont:{family:CONFIG.font},callbacks:{label:c=>c.dataset.yAxisID==='y'?c.dataset.label+': ₪'+Math.round(c.parsed.y).toLocaleString():c.dataset.label+': '+Math.round(c.parsed.y).toLocaleString()}}},
      scales:{
        y:{position:'right',grid:{color:'#eef2f9'},ticks:{font:{family:CONFIG.font,size:9},callback:v=>'₪'+(v>=1000?(v/1000).toFixed(0)+'K':v)}},
        y1:{position:'left',grid:{display:false},ticks:{font:{family:CONFIG.font,size:9},color:'#94a3b8',callback:v=>v>=1000?(v/1000).toFixed(1)+'K':v}},
        x:{grid:{display:false},ticks:{font:{family:CONFIG.font,size:9},maxRotation:0,autoSkip:true,maxTicksLimit:9}}}}
  });

}

// Init
loadData();
</script>
