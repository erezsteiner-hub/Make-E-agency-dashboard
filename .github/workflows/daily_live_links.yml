name: Daily Live Dashboard Links

on:
  schedule:
    - cron: '0 5 * * *'  # כל יום ב-08:00 שעון ישראל
  workflow_dispatch:

jobs:
  send-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Send daily links
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO_CRAZY: ${{ secrets.EMAIL_TO_CRAZY }}
          EMAIL_TO_PRETTY: ${{ secrets.EMAIL_TO_PRETTY }}
          EMAIL_TO_ANNABELLA: ${{ secrets.EMAIL_TO_ANNABELLA }}
          EMAIL_TO_FINE: ${{ secrets.EMAIL_TO_FINE }}
          EMAIL_TO_LASTER: ${{ secrets.EMAIL_TO_LASTER }}
          EMAIL_TO_ARISTO: ${{ secrets.EMAIL_TO_ARISTO }}
        run: python send_daily_links.py
