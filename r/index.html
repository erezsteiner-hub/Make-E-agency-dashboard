<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>מדד ביצועים · MAKE-E</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f5fb;color:#17142a;font-family:"Assistant",system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){body{background:#12101c;color:#efecfa}}
.box{text-align:center;padding:24px;max-width:360px}
.sp{width:34px;height:34px;border:3px solid #ece6ff;border-top-color:#5b2be0;border-radius:50%;margin:0 auto 14px;animation:r 0.9s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
small{color:#6b6782}
</style>
</head>
<body>
<div class="box" id="box"><div class="sp"></div><div id="msg">טוען את הדשבורד…</div><small>MAKE-E Digital</small></div>
<script>
// Each client link is  …/r/#<token>. The token never leaves the browser (URL fragment):
// it names the client's encrypted file (sha256) and is the key that decrypts it (AES-GCM).
(async function () {
  const msg = t => { document.getElementById('msg').textContent = t; document.querySelector('.sp').remove(); };
  const tok = location.hash.slice(1).trim();
  if (!tok || tok.length < 16) return msg('הקישור לא שלם. פתחו את הקישור המלא שקיבלתם.');
  const enc = new TextEncoder();
  const sha = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(s)));
  const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  try {
    const id = hex(await sha('id|' + tok)).slice(0, 24);
    const local = ['localhost', '127.0.0.1'].includes(location.hostname);
    const base = local ? '../_dash_out/d/' : 'https://raw.githubusercontent.com/erezsteiner-hub/Make-E-agency-dashboard/dash-data/d/';
    const res = await fetch(base + id + '.bin', { cache: 'no-store' });
    if (!res.ok) return msg('הקישור לא פעיל. לקבלת קישור מעודכן פנו ל-MAKE-E.');
    const buf = new Uint8Array(await res.arrayBuffer());
    const key = await crypto.subtle.importKey('raw', await sha('key|' + tok), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();
    document.write('<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' +
      '<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">' + html + '</html>');
    document.close();
  } catch (e) {
    msg('לא הצלחנו לפתוח את הדשבורד. ודאו שהקישור מלא, או נסו דפדפן מעודכן.');
  }
})();
</script>
</body>
</html>
